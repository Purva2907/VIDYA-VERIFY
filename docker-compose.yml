services:
  db:
    image: postgres:16-alpine
    container_name: vidya_verify_postgres
    restart: always
    environment:
      POSTGRES_USER: vidya_user
      POSTGRES_PASSWORD: vidya_secure_password
      POSTGRES_DB: vidya_verify_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidya_user -d vidya_verify_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vidya_verify_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+psycopg2://vidya_user:vidya_secure_password@db:5432/vidya_verify_db
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ENVIRONMENT=production
      - SECRET_SALT=production_deploy_salt_2026
    ports:
      - "8000:8000"

volumes:
  postgres_data:
